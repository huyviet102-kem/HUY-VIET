<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặng Huy Việt - Danh Thiếp Điện Tử</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><defs><linearGradient id='rainbow' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23FF3B30'/><stop offset='20%' stop-color='%23FF9500'/><stop offset='40%' stop-color='%23FFCC00'/><stop offset='60%' stop-color='%2334C759'/><stop offset='80%' stop-color='%23007AFF'/><stop offset='100%' stop-color='%23AF52DE'/></linearGradient></defs><path d='M5 3 L23 13 L14 16 L11 25 Z' fill='url(%23rainbow)' stroke='white' stroke-width='1.8' stroke-linejoin='round'/></svg>") 4 2, auto;
    }

    a, button {
      cursor: inherit;
    }

    /* Thẻ phong cách Apple Minimalist */
    .apple-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.06), 0 0 1px rgba(0, 0, 0, 0.1);
    }

    /* Khung viên thuốc kiểu Apple Dynamic Island màu cam */
    .island-orange {
      background: linear-gradient(135deg, #ff9f0a 0%, #ff7a00 100%);
      color: #ffffff;
      border-radius: 9999px;
      box-shadow: 0 8px 20px -6px rgba(255, 122, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), filter 0.2s ease;
    }

    .island-orange:hover {
      transform: translateY(-1.5px) scale(1.01);
      filter: brightness(1.03);
    }

    .island-orange:active {
      transform: scale(0.98);
    }

    /* Vương miệng bling bling lấp lánh */
    .bling-crown {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%) rotate(-4deg);
      font-size: 28px;
      line-height: 1;
      filter: drop-shadow(0 0 8px rgba(255, 214, 10, 0.9)) drop-shadow(0 0 16px rgba(255, 149, 0, 0.75));
      animation: blingPulse 2s ease-in-out infinite;
      z-index: 10;
    }

    @keyframes blingPulse {
      0%, 100% {
        transform: translateX(-50%) rotate(-4deg) scale(1);
        filter: drop-shadow(0 0 7px rgba(255, 214, 10, 0.85)) drop-shadow(0 0 14px rgba(255, 149, 0, 0.7));
      }
      50% {
        transform: translateX(-50%) rotate(3deg) scale(1.1);
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 1)) drop-shadow(0 0 22px rgba(255, 204, 0, 0.95));
      }
    }

    /* Hiệu ứng hạt cầu vồng theo chuột */
    .rainbow-trail {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      z-index: 9999;
      transform: translate(-50%, -50%);
      animation: fadeOut 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeOut {
      0% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.15);
      }
    }
  </style>
</head>
<body class="flex items-center justify-center p-5">
  <div class="w-full max-w-[410px] mx-auto">
    <div class="apple-card rounded-[32px] p-7 text-center relative overflow-hidden">

      <!-- Avatar + Vương miệng bling bling -->
      <div class="relative mt-2 mb-5">
        <span class="bling-crown" aria-hidden="true">👑</span>
        <div class="w-24 h-24 mx-auto rounded-full bg-gradient-to-b from-[#2c2c2e] to-[#1d1d1f] p-[2px] shadow-md">
          <div class="w-full h-full bg-[#1d1d1f] rounded-full flex items-center justify-center text-2xl font-semibold tracking-tight text-white">
            ĐHV
          </div>
        </div>
        <span class="absolute bottom-0.5 right-[36%] bg-[#34c759] w-3.5 h-3.5 rounded-full border-[2.5px] border-white" title="Đang hoạt động"></span>
      </div>

      <!-- Tên & Chuyên ngành -->
      <h1 class="text-[26px] font-semibold tracking-tight text-[#1d1d1f] leading-tight mb-1">
        Đặng Huy Việt
      </h1>
      <p class="text-[#86868b] text-[15px] font-normal mb-6">
        Chuyên Lý • THPT Chuyên Bến Tre
      </p>

      <!-- Nhóm khung Dynamic Island màu cam: Ngày sinh, Chuyên Lý, ACB -->
      <div class="space-y-2.5 mb-6 text-left">
        <div class="grid grid-cols-2 gap-2.5">
          <div class="island-orange px-4 py-2.5 flex items-center space-x-2.5">
            <i class="fa-solid fa-cake-candles text-sm opacity-95"></i>
            <div class="leading-tight">
              <div class="text-[10px] uppercase tracking-wider opacity-85 font-medium">Ngày sinh</div>
              <div class="text-[13.5px] font-semibold">22/02/2010</div>
            </div>
          </div>

          <div class="island-orange px-4 py-2.5 flex items-center space-x-2.5">
            <i class="fa-solid fa-atom text-sm opacity-95"></i>
            <div class="leading-tight min-w-0">
              <div class="text-[10px] uppercase tracking-wider opacity-85 font-medium">Lớp chuyên</div>
              <div class="text-[13.5px] font-semibold truncate">Chuyên Lý</div>
            </div>
          </div>
        </div>

        <!-- Khung tài khoản ngân hàng ACB (bấm để sao chép) -->
        <button
          type="button"
          onclick="copyAcbAccount()"
          class="island-orange w-full px-4 py-3 flex items-center justify-between text-left"
          title="Nhấn để sao chép STK ACB"
        >
          <div class="flex items-center space-x-3">
            <span class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center text-xs font-bold">
              ACB
            </span>
            <div class="leading-tight">
              <div class="text-[10px] uppercase tracking-wider opacity-85 font-medium">Ngân hàng ACB</div>
              <div class="text-[14.5px] font-semibold tracking-wide">44611217</div>
            </div>
          </div>
          <span id="copy-status" class="text-[11px] font-medium bg-white/20 px-2.5 py-1 rounded-full">
            <i class="fa-regular fa-copy mr-1"></i>Copy
          </span>
        </button>
      </div>

      <!-- Từng mục Thể thao, Cầu lông, Bóng đá dạng Dynamic Island màu cam -->
      <div class="mb-7 text-left">
        <div class="text-[11px] font-medium text-[#86868b] uppercase tracking-wider mb-2 px-1">
          Sở thích
        </div>
        <div class="flex flex-wrap gap-2">
          <div class="island-orange px-3.5 py-2 flex items-center space-x-2 text-[13px] font-medium">
            <i class="fa-solid fa-bolt text-xs"></i>
            <span>Thể thao</span>
          </div>
          <div class="island-orange px-3.5 py-2 flex items-center space-x-2 text-[13px] font-medium">
            <i class="fa-solid fa-feather text-xs"></i>
            <span>Cầu lông</span>
          </div>
          <div class="island-orange px-3.5 py-2 flex items-center space-x-2 text-[13px] font-medium">
            <i class="fa-regular fa-futbol text-xs"></i>
            <span>Bóng đá</span>
          </div>
        </div>
      </div>

      <!-- Các nút liên hệ phong cách Apple -->
      <div class="space-y-3">
        <a href="tel:0365966945" class="w-full py-3.5 px-5 bg-[#1d1d1f] hover:bg-[#333336] active:scale-[0.99] text-white text-[15px] font-medium rounded-full flex items-center justify-center space-x-2.5 transition-all duration-200 shadow-xs">
          <i class="fa-solid fa-phone text-xs"></i>
          <span>036 596 6945</span>
        </a>

        <a href="https://www.facebook.com/share/1EhuqUdwd6/?mibextid=wwXIfr" target="_blank" class="w-full py-3.5 px-5 bg-[#0071e3] hover:bg-[#0077ed] active:scale-[0.99] text-white text-[15px] font-medium rounded-full flex items-center justify-center space-x-2.5 transition-all duration-200 shadow-xs">
          <i class="fa-brands fa-facebook text-base"></i>
          <span>Kết nối Facebook</span>
        </a>
      </div>

      <!-- Chân trang -->
      <div class="mt-7 pt-4 border-t border-black/[0.06] text-[12px] text-[#86868b]">
        THPT Chuyên Bến Tre • Chúc bạn một ngày tốt lành
      </div>
    </div>
  </div>

  <!-- Script sao chép STK ACB & hiệu ứng chuột cầu vồng -->
  <script>
    function copyAcbAccount() {
      const stk = '44611217';
      const badge = document.getElementById('copy-status');
      navigator.clipboard?.writeText(stk).catch(() => {});
      if (badge) {
        badge.innerHTML = '<i class="fa-solid fa-check mr-1"></i>Đã chép';
        setTimeout(() => {
          badge.innerHTML = '<i class="fa-regular fa-copy mr-1"></i>Copy';
        }, 1600);
      }
    }

    const rainbowColors = [
      '#FF3B30',
      '#FF9500',
      '#FFCC00',
      '#34C759',
      '#00C7BE',
      '#007AFF',
      '#AF52DE'
    ];

    let colorIndex = 0;
    let lastTime = 0;

    function createRainbowParticle(x, y) {
      const now = Date.now();
      if (now - lastTime < 16) return;
      lastTime = now;

      const dot = document.createElement('div');
      dot.className = 'rainbow-trail';

      const size = Math.random() * 6 + 6;
      const color = rainbowColors[colorIndex];
      colorIndex = (colorIndex + 1) % rainbowColors.length;

      dot.style.width = `${size}px`;
      dot.style.height = `${size}px`;
      dot.style.left = `${x}px`;
      dot.style.top = `${y}px`;
      dot.style.backgroundColor = color;
      dot.style.boxShadow = `0 0 8px ${color}`;

      document.body.appendChild(dot);

      setTimeout(() => {
        dot.remove();
      }, 750);
    }

    document.addEventListener('mousemove', (e) => {
      createRainbowParticle(e.clientX, e.clientY);
    });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        createRainbowParticle(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });
  </script>
</body>
</html>
