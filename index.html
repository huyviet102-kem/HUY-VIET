<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặng Huy Việt - Danh Thiếp Điện Tử</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><defs><linearGradient id='rainbow' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23FF3B30'/><stop offset='20%' stop-color='%23FF9500'/><stop offset='40%' stop-color='%23FFCC00'/><stop offset='60%' stop-color='%2334C759'/><stop offset='80%' stop-color='%23007AFF'/><stop offset='100%' stop-color='%23AF52DE'/></linearGradient></defs><path d='M5 3 L23 13 L14 16 L11 25 Z' fill='url(%23rainbow)' stroke='white' stroke-width='1.8' stroke-linejoin='round'/></svg>") 4 2, auto;
    }

    a, button {
      cursor: inherit;
    }

    /* Thẻ lớn phong cách Apple Minimalist cho màn hình máy tính */
    .apple-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.08), 0 0 1px rgba(0, 0, 0, 0.12);
    }

    /* Khung viên thuốc kiểu Apple Dynamic Island màu cam */
    .island-orange {
      background: linear-gradient(135deg, #ff9f0a 0%, #ff7a00 100%);
      color: #ffffff;
      border-radius: 9999px;
      box-shadow: 0 10px 24px -6px rgba(255, 122, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.38);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), filter 0.2s ease;
    }

    .island-orange:hover {
      transform: translateY(-2px) scale(1.01);
      filter: brightness(1.04);
    }

    .island-orange:active {
      transform: scale(0.98);
    }

    /* Vương miệng bling bling lấp lánh */
    .bling-crown {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%) rotate(-4deg);
      font-size: 36px;
      line-height: 1;
      filter: drop-shadow(0 0 8px rgba(255, 214, 10, 0.9)) drop-shadow(0 0 18px rgba(255, 149, 0, 0.8));
      animation: blingPulse 2s ease-in-out infinite;
      z-index: 10;
    }

    @keyframes blingPulse {
      0%, 100% {
        transform: translateX(-50%) rotate(-4deg) scale(1);
        filter: drop-shadow(0 0 8px rgba(255, 214, 10, 0.85)) drop-shadow(0 0 16px rgba(255, 149, 0, 0.75));
      }
      50% {
        transform: translateX(-50%) rotate(3deg) scale(1.12);
        filter: drop-shadow(0 0 14px rgba(255, 255, 255, 1)) drop-shadow(0 0 26px rgba(255, 204, 0, 0.95));
      }
    }

    /* Hiệu ứng hạt cầu vồng theo chuột */
    .rainbow-trail {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      z-index: 9999;
      transform: translate(-50%, -50%);
      animation: fadeOut 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeOut {
      0% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.15);
      }
    }
  </style>
</head>
<body class="flex items-center justify-center p-6 md:p-10">
  <!-- Khung lớn max-w-4xl tối ưu cho màn hình máy tính -->
  <div class="w-full max-w-4xl mx-auto">
    <div class="apple-card rounded-[36px] p-8 md:p-12 relative overflow-hidden">

      <div class="grid grid-cols-1 md:grid-cols-12 gap-8 md:gap-10 items-center">
        
        <!-- Cột trái (5/12): Avatar, Tên, Chuyên ngành & Nút liên hệ -->
        <div class="md:col-span-5 text-center md:border-r md:border-black/[0.06] md:pr-8 flex flex-col items-center">
          <!-- Avatar + Vương miệng bling bling -->
          <div class="relative mt-4 mb-6">
            <span class="bling-crown" aria-hidden="true">👑</span>
            <div class="w-32 h-32 mx-auto rounded-full bg-gradient-to-b from-[#2c2c2e] to-[#1d1d1f] p-[3px] shadow-lg overflow-hidden">
              <!-- Để chèn ảnh đại diện: thay thẻ div bên dưới bằng <img src="avatar.jpg" alt="Đặng Huy Việt" class="w-full h-full object-cover object-top rounded-full"> -->
              <div class="w-full h-full bg-[#1d1d1f] rounded-full flex items-center justify-center text-3xl font-semibold tracking-tight text-white">
                ĐHV
              </div>
            </div>
            <span class="absolute bottom-1 right-2 bg-[#34c759] w-4 h-4 rounded-full border-[3px] border-white" title="Đang hoạt động"></span>
          </div>

          <h1 class="text-3xl font-semibold tracking-tight text-[#1d1d1f] leading-tight mb-1.5">
            Đặng Huy Việt
          </h1>
          <p class="text-[#86868b] text-[15.5px] font-normal mb-7">
            Chuyên Lý • THPT Chuyên Bến Tre
          </p>

          <!-- Các nút liên hệ -->
          <div class="w-full space-y-3">
            <a href="tel:0365966945" class="w-full py-3.5 px-6 bg-[#1d1d1f] hover:bg-[#333336] active:scale-[0.99] text-white text-[15px] font-medium rounded-full flex items-center justify-center space-x-2.5 transition-all duration-200 shadow-xs">
              <i class="fa-solid fa-phone text-xs"></i>
              <span>036 596 6945</span>
            </a>

            <a href="https://www.facebook.com/share/1EhuqUdwd6/?mibextid=wwXIfr" target="_blank" class="w-full py-3.5 px-6 bg-[#0071e3] hover:bg-[#0077ed] active:scale-[0.99] text-white text-[15px] font-medium rounded-full flex items-center justify-center space-x-2.5 transition-all duration-200 shadow-xs">
              <i class="fa-brands fa-facebook text-base"></i>
              <span>Kết nối Facebook</span>
            </a>
          </div>
        </div>

        <!-- Cột phải (7/12): Các mục thông tin Dynamic Island màu cam -->
        <div class="md:col-span-7 space-y-6 text-left">
          
          <!-- Nhóm thông tin cá nhân -->
          <div>
            <div class="text-[12px] font-semibold text-[#86868b] uppercase tracking-wider mb-3 px-1">
              Thông tin cá nhân
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div class="island-orange px-5 py-3.5 flex items-center space-x-3.5">
                <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center shrink-0">
                  <i class="fa-solid fa-cake-candles text-base"></i>
                </div>
                <div class="leading-tight">
                  <div class="text-[11px] uppercase tracking-wider opacity-85 font-medium">Ngày sinh</div>
                  <div class="text-[15px] font-semibold">22/02/2010</div>
                </div>
              </div>

              <div class="island-orange px-5 py-3.5 flex items-center space-x-3.5">
                <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center shrink-0">
                  <i class="fa-solid fa-atom text-base"></i>
                </div>
                <div class="leading-tight min-w-0">
                  <div class="text-[11px] uppercase tracking-wider opacity-85 font-medium">Lớp chuyên</div>
                  <div class="text-[15px] font-semibold truncate">Chuyên Lý</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Nhóm tài khoản ngân hàng ACB -->
          <div>
            <div class="text-[12px] font-semibold text-[#86868b] uppercase tracking-wider mb-3 px-1">
              Tài khoản ngân hàng
            </div>
            <button
              type="button"
              onclick="copyAcbAccount()"
              class="island-orange w-full px-5 py-4 flex items-center justify-between text-left"
              title="Nhấn để sao chép STK ACB"
            >
              <div class="flex items-center space-x-3.5">
                <span class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-xs font-bold tracking-wide shrink-0">
                  ACB
                </span>
                <div class="leading-tight">
                  <div class="text-[11px] uppercase tracking-wider opacity-85 font-medium">Ngân hàng Á Châu (ACB)</div>
                  <div class="text-[17px] font-semibold tracking-wider">44611217</div>
                </div>
              </div>
              <span id="copy-status" class="text-[12px] font-medium bg-white/20 hover:bg-white/30 px-3.5 py-1.5 rounded-full transition">
                <i class="fa-regular fa-copy mr-1.5"></i>Sao chép
              </span>
            </button>
          </div>

          <!-- Nhóm sở thích: Thể thao, Cầu lông, Bóng đá -->
          <div>
            <div class="text-[12px] font-semibold text-[#86868b] uppercase tracking-wider mb-3 px-1">
              Sở thích & Hoạt động
            </div>
            <div class="flex flex-wrap gap-3">
              <div class="island-orange px-5 py-3 flex items-center space-x-2.5 text-[14.5px] font-medium">
                <i class="fa-solid fa-bolt text-sm"></i>
                <span>Thể thao</span>
              </div>
              <div class="island-orange px-5 py-3 flex items-center space-x-2.5 text-[14.5px] font-medium">
                <i class="fa-solid fa-feather text-sm"></i>
                <span>Cầu lông</span>
              </div>
              <div class="island-orange px-5 py-3 flex items-center space-x-2.5 text-[14.5px] font-medium">
                <i class="fa-regular fa-futbol text-sm"></i>
                <span>Bóng đá</span>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Chân trang -->
      <div class="mt-9 pt-5 border-t border-black/[0.06] flex flex-col sm:flex-row items-center justify-between text-[12.5px] text-[#86868b] gap-2">
        <span>THPT Chuyên Bến Tre • Chuyên Lý</span>
        <span>Chúc bạn một ngày tốt lành</span>
      </div>
    </div>
  </div>

  <!-- Script sao chép STK ACB & hiệu ứng chuột cầu vồng -->
  <script>
    function copyAcbAccount() {
      const stk = '44611217';
      const badge = document.getElementById('copy-status');
      navigator.clipboard?.writeText(stk).catch(() => {});
      if (badge) {
        badge.innerHTML = '<i class="fa-solid fa-check mr-1.5"></i>Đã chép';
        setTimeout(() => {
          badge.innerHTML = '<i class="fa-regular fa-copy mr-1.5"></i>Sao chép';
        }, 1600);
      }
    }

    const rainbowColors = [
      '#FF3B30',
      '#FF9500',
      '#FFCC00',
      '#34C759',
      '#00C7BE',
      '#007AFF',
      '#AF52DE'
    ];

    let colorIndex = 0;
    let lastTime = 0;

    function createRainbowParticle(x, y) {
      const now = Date.now();
      if (now - lastTime < 16) return;
      lastTime = now;

      const dot = document.createElement('div');
      dot.className = 'rainbow-trail';

      const size = Math.random() * 6 + 6;
      const color = rainbowColors[colorIndex];
      colorIndex = (colorIndex + 1) % rainbowColors.length;

      dot.style.width = `${size}px`;
      dot.style.height = `${size}px`;
      dot.style.left = `${x}px`;
      dot.style.top = `${y}px`;
      dot.style.backgroundColor = color;
      dot.style.boxShadow = `0 0 8px ${color}`;

      document.body.appendChild(dot);

      setTimeout(() => {
        dot.remove();
      }, 750);
    }

    document.addEventListener('mousemove', (e) => {
      createRainbowParticle(e.clientX, e.clientY);
    });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        createRainbowParticle(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });
  </script>
</body>
</html>
