    /* Canvas vũ trụ 3D toàn màn hình */
    #space-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    /* Thẻ kính mờ phong cách Apple trên nền vũ trụ */
    .apple-glass-card {
      background: rgba(18, 22, 36, 0.62);
      backdrop-filter: blur(26px) saturate(160%);
      -webkit-backdrop-filter: blur(26px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .apple-glass-card.hidden-mode {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }
